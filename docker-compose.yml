services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: steam-predictor-backend
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=*
      - PIPELINE_API_KEY=secret-pipeline-key
      - DATABASE_URL=sqlite:////app/data/steam.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: steam-predictor-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
